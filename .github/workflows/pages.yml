name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Cancelar despliegue de Pages trabado (si existe)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(gh api -X POST repos/${{ github.repository }}/pages/deployments/4340e0a09ee70b0d281c39d9c400eba5e9cca254/cancel 2>&1) && echo "::notice::cancel OK: $out" || echo "::warning::cancel FALLO: $out"
          out2=$(gh api repos/${{ github.repository }}/pages/deployments/4340e0a09ee70b0d281c39d9c400eba5e9cca254 2>&1); echo "::notice::estado: $out2"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
